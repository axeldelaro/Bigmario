# Configuration Render pour bigmario.onrender.com
# Ce service Node.js fait DEUX choses :
#   1. Sert les fichiers statiques du jeu (HTML, JS, CSS...)
#   2. Gère les salons multijoueurs via WebSocket
#
# Configuration sur render.com :
#   - Type : Web Service
#   - Root Directory : . (laisser vide / racine du repo)
#   - Build Command : cd server && npm install
#   - Start Command : node server/server.js
services:
  - type: web
    name: bigmario
    runtime: node
    rootDir: .
    plan: free
    buildCommand: cd server && npm install
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
