# Déploie automatiquement le serveur Node.js sur Render à chaque push
# affectant le dossier server/.
# Prérequis : ajouter le secret RENDER_DEPLOY_HOOK_URL dans
# Settings > Secrets and variables > Actions du dépôt GitHub.
# Le Deploy Hook se trouve sur render.com : service > Settings > Deploy Hook.
name: Deploy Server to Render

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL n'est pas configuré — skip."
            exit 0
          fi
          curl -sf -X POST "$HOOK" && echo "Déploiement déclenché."
